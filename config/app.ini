APP_NAME = Gitea protected branch deletion demo
RUN_MODE = prod
RUN_USER = root

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[server]
DOMAIN = localhost
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
APP_DATA_PATH = /data/gitea
STATIC_ROOT_PATH = /workspace
DISABLE_SSH = true
LFS_START_SERVER = false

[security]
INSTALL_LOCK = true
SECRET_KEY = local-demo-only-not-for-production
INTERNAL_TOKEN = local-demo-only-not-for-production

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false

[actions]
ENABLED = false

[session]
PROVIDER = file
PROVIDER_CONFIG = /data/gitea/sessions

[log]
MODE = console
LEVEL = info
ROOT_PATH = /data/gitea/log
